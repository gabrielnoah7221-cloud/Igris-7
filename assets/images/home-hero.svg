<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="50%" stop-color="#0a1936"/>
      <stop offset="100%" stop-color="#04070f"/>
    </linearGradient>
    <radialGradient id="monarchGlow" cx="72%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#3a7bd5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#04070f" stop-opacity="0"/>
