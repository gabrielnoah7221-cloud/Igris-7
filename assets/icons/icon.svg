<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="55%" stop-color="#0a1633"/>
      <stop offset="100%" stop-color="#03050c"/>
    </linearGradient>
    <linearGradient id="armorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a6e"/>
      <stop offset="50%" stop-color="#0f2147"/>
      <stop offset="100%" stop-color="#070f24"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a7bd5"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Shield Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="18" y="18" width="476" height="476" rx="92" fill="none" stroke="url(#cyanGlow)" stroke-width="6" opacity="0.85"/>

  <!-- Energy Plume / Crown Crest -->
  <path d="M256 42 L292 126 L256 104 L220 126 Z" fill="#00d2ff"/>
  <path d="M256 26 L325 142 L285 138 L256 84 L227 138 L187 142 Z" fill="url(#cyanGlow)" opacity="0.7"/>

  <!-- Shadow Knight Helmet Silhouette -->
  <path d="M148 164 L256 112 L364 164 L382 288 L328 418 L256 462 L184 418 L130 288 Z" fill="url(#armorGrad)" stroke="#00d2ff" stroke-width="5"/>

  <!-- Inner Cheek & Faceplates -->
  <path d="M170 190 L256 148 L342 190 L352 282 L256 430 L160 282 Z" fill="#060c1b" stroke="#3a7bd5" stroke-width="3"/>

  <!-- Glowing Cyan Eyes -->
  <polygon points="182,246 242,266 232,282 174,264" fill="#00d2ff"/>
  <polygon points="330,246 270,266 280,282 338,264" fill="#00d2ff"/>

  <!-- Central Nose & Forehead Rune Blade -->
  <polygon points="256,154 268,256 256,386 244,256" fill="url(#cyanGlow)"/>

  <!-- Lower Mask Vents -->
  <line x1="204" y1="330" x2="236" y2="365" stroke="#00d2ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="216" y1="358" x2="240" y2="385" stroke="#00d2ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="308" y1="330" x2="276" y2="365" stroke="#00d2ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="296" y1="358" x2="272" y2="385" stroke="#00d2ff" stroke-width="5" stroke-linecap="round"/>
</svg>
